[package]
name = "gpui-loading"
version = "0.1.0"
edition = "2024"
description = "Beautiful loading indicators for GPUI, ported from loading.dev."
license = "MIT"
keywords = ["gpui", "spinner", "loading", "loader", "indicator"]

[dependencies]
gpui = "0.2.2"
log = "0.4"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }

# pedantic
missing_errors_doc = "allow"

# restriction
clone_on_ref_ptr = "warn"
dbg_macro = "warn"
expect_used = "warn"
get_unwrap = "warn"
let_underscore_must_use = "warn"
map_err_ignore = "warn"
mem_forget = "warn"
mod_module_files = "warn"
multiple_unsafe_ops_per_block = "warn"
panic_in_result_fn = "warn"
todo = "warn"
undocumented_unsafe_blocks = "warn"
unimplemented = "warn"
unreachable = "warn"
unused_result_ok = "warn"
unwrap_in_result = "warn"
unwrap_used = "warn"
wildcard_enum_match_arm = "warn"
